name: Desplegar chat en Render
on:
  push:
    branches: [Lab6-SeguridadInfo]

permissions:
  contents: read

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar pruebas (Jest)
        run: npm test
      
      # --- SI LAS PRUEBAS FALLAN, EL FLUJO SE DETIENE AQUÍ ---

      - name: Solicitar despliegue a Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl --fail --silent --show-error --output /dev/null \
          --get --data-urlencode "ref=${{ github.sha }}" \
          "${{ env.RENDER_DEPLOY_HOOK_URL }}"
